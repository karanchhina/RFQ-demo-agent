[project]
name = "rfq-demo-agent"
version = "0.1.0"
description = "A notebook-first quote-to-order agent learning project"
requires-python = ">=3.12,<3.15"
dependencies = [
    "langchain>=1.4,<1.5",
    "langchain-core>=1.6,<1.7",
    "langchain-openai>=1.6,<1.7",
    "langgraph>=1.2,<1.3",
    "langsmith>=0.12,<0.13",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
]

[project.scripts]
quote-agent-reset = "quote_agent.reset_dev_state:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3,<8",
    "ipython>=9.17,<10",
    "jupyterlab>=4.6,<5",
    "langgraph-cli[inmem]>=0.4,<0.5",
    "pytest>=9.1,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quote_agent", "evals"]

[tool.pytest.ini_options]
markers = [
    "integration: calls the configured OpenAI model",
]
